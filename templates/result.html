<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تم إنشاء الأوردر</title>
<style>
  body {
    margin: 0; background: #f5f2ee; color: #2a2420;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    background: #fff; border: 1px solid #e3ddd4; border-radius: 12px; padding: 28px;
    max-width: 420px; text-align: center;
  }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  p { color: #7a6f65; margin: 0 0 20px; }
  a.btn, a.link {
    display: block; padding: 12px; border-radius: 10px; text-decoration: none; margin-top: 10px;
  }
  a.btn { background: #8a6d3b; color: #fff; font-weight: 600; }
  a.link { color: #8a6d3b; }
</style>
</head>
<body>
<div class="card">
  <h1>تم إنشاء الأوردر {{ order_name }} بنجاح ✅</h1>
  {% if test_mode %}
    <p style="color:#b3402c;">ده أوردر تجريبي (Test order) — مش هيأثر على المخزون أو الإحصائيات، وتقدر تمسحه من الأدمن براحتك.</p>
  {% endif %}
  <p>تقدر تراجعه أو تعدله من لوحة تحكم Shopify.</p>
  <a class="btn" href="{{ admin_url }}" target="_blank" rel="noopener">فتح الأوردر في Shopify</a>
  <a class="link" href="{{ url_for('index') }}">إدخال أوردر جديد</a>
</div>
</body>
</html>
